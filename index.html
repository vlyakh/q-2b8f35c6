<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анкета сумісності</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1d1b18;--muted:#6b665d;--line:#e3ded3;
  --accent:#c2502e;--accent-ink:#ffffff;--soft:#f3e3da;--good:#2f7d4f;--warn:#a2601a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16140f;--card:#211e18;--ink:#f1ece2;--muted:#a59e90;--line:#3a352c;
    --accent:#e0754f;--accent-ink:#16140f;--soft:#3a2a22;--good:#6cc093;--warn:#e0a35a;
  }
}
:root[data-theme="dark"]{
  --bg:#16140f;--card:#211e18;--ink:#f1ece2;--muted:#a59e90;--line:#3a352c;
  --accent:#e0754f;--accent-ink:#16140f;--soft:#3a2a22;--good:#6cc093;--warn:#e0a35a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px}
h2{font-size:20px;margin:24px 0 8px}
h3{font-size:16px;margin:16px 0 6px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
input[type=text],textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opt{text-align:left;padding:11px 14px}
.opt.sel{background:var(--soft);border-color:var(--accent);font-weight:600}
.opt.any{color:var(--muted);border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:6px 12px;border-radius:999px;font-size:14px}
.chip.on{background:var(--soft);border-color:var(--accent);font-weight:600}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 16px}
.progress>i{display:block;height:100%;background:var(--accent)}
.q{font-size:19px;font-weight:600;margin:4px 0 4px}
.me{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.me .q{font-size:16px}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px}
.score{font-size:64px;font-weight:700;line-height:1;margin:8px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.good{color:var(--good)}.warn{color:var(--warn)}
.small{font-size:13px}
.person{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.person:last-child{border-bottom:0}
.pair{border-top:1px solid var(--line);padding:10px 0}
.pair:first-of-type{border-top:0}
.ask{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:8px}
.asq{font-weight:600}
</style>
</head>

// Жартівливі питання: у сумісність не рахуються, у результаті стоять поруч.
// Рід: {ч|ж} за статтю того, хто відповідає; {ж|ч} у зворотному порядку там, де йдеться про партнера.
const FUN = [
  {id:"s_looks",grp:"self",t:"Зовнішність", q:"Наскільки ти вважаєш себе {гарним|гарною}? Чесно, ніхто не бачить.", o:["Звичайн{ий|а}, нічого особливого","Симпатичн{ий|а}","{Гарний|Гарна}, і знаю це","Дуже {гарний|гарна}, на мене озираються"]},
  {id:"s_smart",grp:"self",t:"Розум", q:"А наскільки {розумним|розумною}?", o:["Скоріше звичайн{ий|а}","Як більшість","Розумніш{ий|а} за більшість","Дуже {розумний|розумна}, мало хто встигає за моєю думкою"]},
  {id:"s_best",grp:"self",t:"Найкраще в тобі", q:"Що в тобі найкраще, на твою думку?", o:["Зовнішність","Розум","Характер: {добрий|добра}, на мене можна покластися","Почуття гумору","Руки, які все вміють","Вміння любити й піклуватися"]},
];
const SECS = {
  1:{n:"Про тебе", intro:["Частина 1 з 4","Коротко про тебе","Звички й характер, як є насправді, а не як «правильно». Один варіант; якщо буває по-різному, для цього є окремий варіант."]},
  2:{n:"Звички й характер", intro:["Частина 2 з 4","{Як би ти поставився, якби вона…|Як би ти поставилася, якби він…}","Не про зовнішність, а про звички й характер. Питання «якби {вона|він}…»: як би ти до цього {поставився|поставилася}."]},
  3:{n:"Ви вдвох", intro:["Частина 3 з 4","Ви вдвох","Уяви {свою ідеальну дівчину|свого ідеального хлопця}. Спершу будні, потім конкретні ситуації. У кожному питанні спершу чого ти чекаєш від {неї|нього} (усе, що підходить), потім як у тебе сам{ого|ої}."]},
  4:{n:"Як має бути у вас", intro:["Частина 4 з 4","Майбутнє разом","Як ти хочеш, щоб було у вас двох. У кінці три головні речі в житті."]},
};
// Жартівливе питання вставляється після питання з таким id.
const FUN_AFTER = {order:["s_looks","s_smart","s_best"]};
const withFun = (arr, mk, pre) => arr.flatMap((x,i)=>{ const f = [].concat(FUN_AFTER[(pre||"")+x.id] || []); return [mk(x,i), ...f.map(id=>({kind:"fun", i:FUN.findIndex(y=>y.id===id)}))]; });
const STEPS = [
  {kind:"intro",sec:1}, ...withFun(BASE, (x,i)=>({kind:"self",i})),
  {kind:"intro",sec:2}, ...withFun(BASE, (x,i)=>({kind:"want",i}), "want_"),
  {kind:"intro",sec:3}, ...withFun(IDEAL, (x,i)=>({kind:"ideal",i})), ...withFun(SIT, (x,i)=>({kind:"sit",i})),
  {kind:"intro",sec:4}, ...withFun(PAIR, (x,i)=>({kind:"pair",i})),
  {kind:"values"},
];
const SECLAB = {1:"Про тебе", 2:"Твоя людина", 3:"Ви вдвох", 4:"Як має бути у вас"};
const SECN = {};
{ let sec = 0; STEPS.forEach(st=>{ if(st.kind==="intro") sec = st.sec; else if(st.kind!=="values"){ st.sec = sec; st.n = SECN[sec] = (SECN[sec]||0) + 1; } }); }
const lab = (st, t) => `${SECLAB[st.sec]} · ${st.n} з ${SECN[st.sec]} · ${esc(t)}`;
const VALUES = ["Сім'я й діти","Кохання й близькість","Здоров'я й тіло","Свобода й самостійність","Подорожі й нові враження","Робота й досягнення","Гроші й достаток","Стабільність і безпека","Віра й традиції","Друзі","Розвиток, навчання","Задоволення від життя"];

// ---------- Стан ----------
const KEY = "couple-match-v13";
// Без імен: перший завжди чоловік, другий жінка.
const ROLE = [{g:"m", name:"Чоловік"},{g:"f", name:"Жінка"}];
function blank(i){ return {name:ROLE[i].name, g:ROLE[i].g, ans:{}, val:[], done:false, step:0}; }
function fresh(){ return {people:[blank(0), blank(1)], view:"start", active:0}; }
function normalize(s){
  if(s.people[0].g==="f" || s.people[1].g==="m") s.people.reverse();
  s.people.forEach((p,i)=>{ p.g = ROLE[i].g; p.name = ROLE[i].name; });
  return s;
}
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.people) return s; }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load() ? normalize(load()) : fresh();

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T = (s, g) => s.replace(/\{([^|}]*)\|([^}]*)\}/g, (_, m, f) => g==="f" ? f : m);
const other = g => g==="m" ? "f" : "m";
function go(view, extra){ Object.assign(S, {view}, extra||{}); save(); render(); window.scrollTo(0,0); }
function render(){
  if(S.view==="start") return viewStart();
  if(S.view==="quiz") return viewQuiz();
  if(S.view==="result") return viewResult();
  if(S.view==="code") return viewCode();
}

// ---------- Початок ----------

  const p = S.people, both = p[0].done && p[1].done;
  $app.innerHTML = `
    <h1>Анкета сумісності</h1>
    <p class="muted">Для двох. Кожен проходить окремо, хвилин 15–20. Спершу коротко про себе, потім якою має бути твоя людина і як вона має вчиняти в конкретних ситуаціях. Відповіді іншого не видно, поки обоє не закінчать.</p>
    <div class="card">
      ${[0,1].map(i=>`
        <div class="person">
          <strong style="flex:1">${esc(p[i].name)}</strong>
          ${p[i].done ? `<span class="good small">готово ✓</span> <button class="small" data-file="${i}">Зберегти відповіді</button>`
            : `<button class="primary" data-start="${i}">${p[i].step>0?"Продовжити":"Почати"}</button>`}
        </div>`).join("")}
    </div>
    <div class="row">
      <button class="primary" id="toResult" ${both?"":"disabled"}>Показати сумісність</button>
      <button id="toCode">Обмін кодами</button>
      <button id="reset">Почати спочатку</button>
    </div>
    <p class="muted small" style="margin-top:20px">Відповідай, як є насправді, а не як «правильно». Це привід поговорити, а не вирок: живу зустріч і «іскру» анкета не міряє. Відповіді зберігаються лише в цьому браузері.</p>
  `;
  $app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{
    go("quiz", {active:+b.dataset.start});
  });
  $app.querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>saveFile(p[+b.dataset.file]));
  document.getElementById("toResult").onclick=()=>go("result");

    const b=e.currentTarget;

// ---------- Анкета ----------
// Відповіді: ans[id] = {me:[індекси], want:[індекси] | null (байдуже) | undefined (ще не відповів)}.
// Скрізь можна обрати кілька варіантів.
function head(p, pct){
  return `<div class="spread"><strong>${esc(p.name)}</strong><button id="home" class="small">На початок</button></div>
    <div class="progress"><i style="width:${pct}%"></i></div>`;
}
document.addEventListener("click", e=>{ if(e.target && e.target.id==="home") go("start"); });
const nav = (ok, last) => `<div class="spread" style="margin-top:20px"><button id="back">Назад</button><button class="primary" id="next" ${ok?"":"disabled"}>${last?"Завершити":"Далі"}</button></div>`;
const wantOpts = it => it.ow || it.o;
const sitOpts = (it, actorG) => it.oBy ? it.oBy[actorG] : it.o;
const sitWant = (it, partnerG) => it.owBy ? it.owBy[partnerG] : (it.ow || it.o);
const ansOf = (p, id) => {
  const a = p.ans[id] || (p.ans[id] = {want:undefined, me:[]});
  if(!Array.isArray(a.me)) a.me = a.me==null ? [] : [a.me];
  if(typeof a.want==="number") a.want = [a.want];
  return a;
};
const has = (arr, k) => Array.isArray(arr) && arr.includes(k);
const optBtns = (opts, sel, key, g) => opts.map((o,k)=>`<button class="opt ${has(sel,k)?"sel":""}" data-${key}="${k}">${esc(T(o,g))}</button>`).join("");
const HINT_ME = `<p class="small muted" style="margin:2px 0 0">Можна кілька, якщо буває по-різному.</p>`;
const HINT_WANT = `<p class="small muted" style="margin:2px 0 0">Обери все, що тобі підходить.</p>`;
const attOf = (a, it) => (Array.isArray(a.att) && a.att.length===it.ask.length) ? a.att : (a.att = it.ask.map(()=>null));
const wantOk = a => a.want===null || (Array.isArray(a.want) && a.want.length>0);

function viewQuiz(){
  const p = S.people[S.active], g = p.g, pg = other(g);
  const st = STEPS[p.step];
  const pct = Math.round(100 * p.step / STEPS.length);
  let body = "", a = null, meMulti = true, auto = false;

  if(st.kind==="intro"){
    const [lab, q, txt] = SECS[st.sec].intro;
    body = `<div class="label">${lab}</div><div class="q">${esc(T(q,g))}</div><p class="muted">${esc(T(txt,g))}</p>${nav(true)}`;
  }
  else if(st.kind==="self"){
    const it = BASE[st.i]; a = ansOf(p, it.id);
    body = `<div class="label">${lab(st, it.t)}</div>
      <div class="q">${esc(T(it.self,g))}</div>
      <div class="opts">${optBtns(it.o, a.me, "me", g)}</div>${nav(a.me.length>0)}`;
    meMulti = false; auto = true;
  }
  else if(st.kind==="want"){
    const it = BASE[st.i]; a = ansOf(p, it.id);
    body = `<div class="label">${lab(st, it.t)}</div>
      <div class="q">${esc(T("Як би ти до цього {поставився|поставилася}?",g))}</div>
      ${it.ask.map((q,j)=>`<div class="ask"><div class="asq">${esc(T(q.q,g))}</div>
        <div class="chips">${ATT.map((l,k)=>`<button class="chip ${attOf(a,it)[j]===k?"on":""}" data-att="${j}:${k}">${esc(T(l,g))}</button>`).join("")}</div></div>`).join("")}
      ${nav(attOf(a,it).every(x=>x!==null))}`;
  }
  else if(st.kind==="sit" || st.kind==="ideal"){
    const L = st.kind==="ideal" ? IDEAL : SIT, it = L[st.i]; a = ansOf(p, it.id);
    body = `<div class="label">${lab(st, it.t)}</div>
      <div class="q">${esc(T(it.want,g))}</div>${HINT_WANT}
      <div class="opts">${optBtns(sitWant(it,pg), a.want, "want", pg)}
        <button class="opt any ${a.want===null?"sel":""}" data-any="1">${ANY}</button></div>
      <div class="me"><div class="q">${esc(T(it.me,g))}</div>${it.meMulti?HINT_ME:""}
        <div class="opts">${optBtns(sitOpts(it,g), a.me, "me", g)}</div></div>
      ${nav(wantOk(a) && a.me.length>0)}`;
    meMulti = !!it.meMulti;
  }
  else if(st.kind==="pair"){
    const it = PAIR[st.i]; a = ansOf(p, it.id);
    body = `<div class="label">${lab(st, it.t)}</div>
      <div class="q">${esc(T(it.want,g))}</div>${it.multi?HINT_WANT:""}
      <div class="opts">${optBtns(it.o, a.me, "me", g)}</div>${nav(a.me.length>0)}`;
    meMulti = !!it.multi; auto = !it.multi;
  }
  else if(st.kind==="fun"){
    const it = FUN[st.i]; a = ansOf(p, it.id);
    body = `<div class="label">${lab(st, it.t)}</div>
      <div class="q">${esc(T(it.q,g))}</div>
      <div class="opts">${optBtns(it.o, a.me, "me", g)}</div>${nav(a.me.length>0)}`;
    meMulti = false; auto = true;
  }
  else if(st.kind==="values"){
    body = `<div class="label">Головне в житті</div>
      <div class="q">Обери рівно три речі, найважливіші для тебе зараз</div>
      <div class="chips" style="margin-top:12px">${VALUES.map((v,k)=>`<button class="chip ${p.val.includes(k)?"on":""}" data-v="${k}">${esc(v)}</button>`).join("")}</div>
      <p class="small muted">Обрано: ${p.val.length} з 3</p>${nav(p.val.length===3, true)}`;
  }

  $app.innerHTML = head(p, pct) + `<div class="card">${body}</div>`;
  const redraw = ()=>{ const y=window.scrollY; save(); viewQuiz(); window.scrollTo(0,y); };
  const toggle = (arr, k) => arr.includes(k) ? arr.filter(x=>x!==k) : [...arr, k].sort((x,y)=>x-y);
  $app.querySelectorAll("[data-me]").forEach(b=>b.onclick=()=>{
    const k = +b.dataset.me;
    if(meMulti){ a.me = toggle(a.me, k); return redraw(); }
    a.me = [k]; save();
    if(auto){ $app.querySelectorAll("[data-me]").forEach(x=>x.classList.toggle("sel", x===b)); setTimeout(()=>step(+1), 250); }
    else redraw();
  });
  $app.querySelectorAll("[data-want]").forEach(b=>b.onclick=()=>{ a.want = toggle(Array.isArray(a.want)?a.want:[], +b.dataset.want); redraw(); });
  $app.querySelectorAll("[data-att]").forEach(b=>b.onclick=()=>{ const [j,k]=b.dataset.att.split(":").map(Number); a.att[j]=k; redraw(); });
  $app.querySelectorAll("[data-any]").forEach(b=>b.onclick=()=>{ a.want = a.want===null ? undefined : null; redraw(); });
  $app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.v;
    if(p.val.includes(k)) p.val = p.val.filter(x=>x!==k); else if(p.val.length<3) p.val = [...p.val, k];
    redraw();
  });
  document.getElementById("back").onclick=()=>step(-1);
  document.getElementById("next").onclick=()=>step(+1);
}

// ---------- Відповіді у файл ----------
function dump(p){
  const g = p.g, pg = other(g), L = [];
  const words = (opts, idx, gg) => Array.isArray(idx) && idx.length ? idx.map(k=>T(opts[k], gg)).join(" / ") : "—";
  L.push(`Анкета сумісності: ${p.name}`, `Збережено: ${new Date().toLocaleString("uk-UA")}`, "");
  let sec = 0;
  for(const st of STEPS){
    if(st.kind==="intro"){ sec = st.sec; L.push("", `== Частина ${sec}: ${SECLAB[sec]} ==`, ""); continue; }
    if(st.kind==="values"){ L.push("", "== Головне в житті ==", p.val.map(k=>VALUES[k]).join(", ") || "—"); continue; }
    const it = {self:BASE, want:BASE, sit:SIT, ideal:IDEAL, pair:PAIR, fun:FUN}[st.kind][st.i];
    const a = p.ans[it.id] || {me:[]};
    if(st.kind==="self") L.push(`${st.n}. ${T(it.self,g)}`, `   → ${words(it.o, a.me, g)}`);
    else if(st.kind==="want"){
      L.push(`${st.n}. ${it.t}: як би ${T("{поставився|поставилася}",g)}`);
      it.ask.forEach((q,j)=>L.push(`   ${T(q.q,g)} → ${Array.isArray(a.att) && a.att[j]!=null ? T(ATT[a.att[j]],g) : "—"}`));
    }
    else if(st.kind==="sit" || st.kind==="ideal"){
      L.push(`${st.n}. ${T(it.want,g)}`, `   чекає: ${a.want===null ? ANY : words(sitWant(it,pg), a.want, pg)}`,
             `   ${T(it.me,g)}`, `   → ${words(sitOpts(it,g), a.me, g)}`);
    }
    else if(st.kind==="pair") L.push(`${st.n}. ${T(it.want,g)}`, `   → ${words(it.o, a.me, g)}`);
    else if(st.kind==="fun") L.push(`${st.n}. ${T(it.q,g)}`, `   → ${words(it.o, a.me, g)}`);
  }
  return L.join("\r\n");
}
function saveFile(p){
  try{
    const d = new Date(), z = n=>String(n).padStart(2,"0");
    const name = `couple-match-${p.g==="f"?"zhinka":"cholovik"}-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.json`;
    const json = JSON.stringify({key:KEY, saved:d.toISOString(), role:p.name, g:p.g, code:encode(p), ans:p.ans, val:p.val, text:dump(p).split("\r\n")}, null, 2);
    const url = URL.createObjectURL(new Blob([json], {type:"application/json;charset=utf-8"}));
    const el = document.createElement("a"); el.href = url; el.download = name; document.body.appendChild(el); el.click(); el.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){}
}

function step(d){
  const p = S.people[S.active];
  const nxt = p.step + d;
  if(nxt < 0) return go("start");
  if(nxt >= STEPS.length){ p.done = true; p.step = STEPS.length; saveFile(p); return go("start"); }
  p.step = nxt; save(); viewQuiz(); window.scrollTo(0,0);
}

// ---------- Підрахунок ----------
// Звички, характер, ситуації: що один сказав про себе проти того, що підходить іншому. «Байдуже» не рахується.
// Якщо про себе обрано кілька варіантів, рахується середнє: кожен свій варіант проти найближчого прийнятного.
// Варіант flex («підлаштовуюсь під партнера») підходить до будь-чого.
// Як має бути у вас: якщо є спільний варіант, збіг повний, інакше найближчі.
// Сусідній варіант на шкалі дає частковий збіг. Разом: 90 % питання, 10 % головне в житті.
function base(it, w, m){
  const n = wantOpts(it) ? wantOpts(it).length : it.oBy.m.length;
  return it.ord ? 1 - Math.abs(w-m)/(n-1) : (w===m ? 1 : 0);
}
function cross(it, wantSet, meSet){
  const per = meSet.map(m => it.flex===m ? 1 : Math.max(...wantSet.map(w=>base(it, w, m))));
  return per.reduce((s,x)=>s+x,0)/per.length;
}
// Ставлення P до того, яким Q себе описав. null, якщо про такий варіант не питали або Q підлаштовується.
function askIdx(it, m){ return it.flex===m ? -1 : it.ask.findIndex(q=>q.m.includes(m)); }
function attScore(it, P, Q){ const j = askIdx(it, Q.me[0]); return j<0 || !Array.isArray(P.att) || P.att[j]==null ? null : ATTV[P.att[j]]; }
function pairSim(it, A, B){ return Math.max(...A.flatMap(x=>B.map(y=>base(it, x, y)))); }
const GROUPS = [
  {k:"base", n:"Звички й характер", items:BASE, type:"cross"},
  {k:"sit", n:"Ви вдвох", items:[...IDEAL, ...SIT], type:"cross"},
  {k:"pair", n:"Як має бути у вас", items:PAIR, type:"pair"},
];
function compute(){
  const [X,Y] = S.people;
  let S_=0, N_=0;
  const groups = GROUPS.map(G=>{
    let s=0, n=0; const rows=[];
    for(const it of G.items){
      const a = X.ans[it.id], b = Y.ans[it.id]; if(!a || !b || !a.me.length || !b.me.length) continue;
      const row = {it, a, b, ma:null, mb:null};
      if(G.type==="pair"){ row.ma = row.mb = pairSim(it, a.me, b.me); s+=row.ma; n++; }
      else if(G.k==="base"){
        row.ma = attScore(it, a, b); row.mb = attScore(it, b, a);
        for(const v of [row.ma, row.mb]) if(v!=null){ s+=v; n++; }
      }
      else {
        if(Array.isArray(a.want) && a.want.length){ row.ma = cross(it, a.want, b.me); s+=row.ma; n++; }
        if(Array.isArray(b.want) && b.want.length){ row.mb = cross(it, b.want, a.me); s+=row.mb; n++; }
      }
      rows.push(row);
    }
    S_+=s; N_+=n;
    return {...G, rows, L: n ? s/n : 1};
  });
  const Q = N_ ? S_/N_ : 1;
  const common = X.val.filter(k=>Y.val.includes(k));
  const V = 0.25 + 0.75*common.length/3;
  const score = Math.max(1, Math.min(99, Math.round(100*(0.9*Q + 0.1*V))));
  return {score, groups, common};
}

// ---------- Результат ----------
function viewResult(){
  const [X,Y] = S.people;
  if(!(X.done && Y.done)) return go("start");
  const r = compute(), nx = esc(X.name), ny = esc(Y.name), pc = x=>Math.round(100*x);
  const mark = m => m==null ? "" : m>=0.99 ? `<span class="good">✓</span>` : m>=0.5 ? `<span class="warn">≈</span>` : `<span class="warn">✗</span>`;
  const worst = o => Math.min(o.ma==null?1:o.ma, o.mb==null?1:o.mb);
  const list = (opts, idx, g) => idx.map(k=>esc(T(opts[k], g))).join(" / ");
  // Що підходить: варіанти описують партнера (рід за статтю партнера). Про себе: за власною статтю.
  const wantTxt = (G, it, P, Q) => {
    const w = P.ans[it.id].want;
    if(!Array.isArray(w)) return `<span class="muted">байдуже</span>`;
    return G.k!=="base" ? list(sitWant(it, Q.g), w, Q.g) : list(wantOpts(it), w, Q.g);
  };
  const meTxt = (G, it, P) => list(G.k!=="base" ? sitOpts(it, P.g) : it.o, P.ans[it.id].me, P.g);

  const attTxt = (it, P, Q) => { const j = askIdx(it, Q.ans[it.id].me[0]); return j<0 ? `<span class="muted">не заважає</span>` : esc(T(ATT[P.ans[it.id].att[j]], P.g)); };
  const block = (G, o) => G.k==="base" ? `
    <div class="pair"><strong>${esc(o.it.t)}</strong>
      <div class="small" style="margin-top:4px">${ny}: ${meTxt(G,o.it,Y)}<br>${nx} про це: ${attTxt(o.it,X,Y)} ${mark(o.ma)}</div>
      <div class="small" style="margin-top:4px">${nx}: ${meTxt(G,o.it,X)}<br>${ny} про це: ${attTxt(o.it,Y,X)} ${mark(o.mb)}</div></div>` : G.type==="pair" ? `
    <div class="pair"><strong>${esc(o.it.t)}</strong> ${mark(o.ma)}
      <div class="small">${nx}: ${meTxt(G,o.it,X)}<br>${ny}: ${meTxt(G,o.it,Y)}</div></div>` : `
    <div class="pair"><strong>${esc(o.it.t)}</strong>
      <div class="small" style="margin-top:4px">${nx} підходить: ${wantTxt(G,o.it,X,Y)}<br>${ny}: ${meTxt(G,o.it,Y)} ${mark(o.ma)}</div>
      <div class="small" style="margin-top:4px">${ny} підходить: ${wantTxt(G,o.it,Y,X)}<br>${nx}: ${meTxt(G,o.it,X)} ${mark(o.mb)}</div></div>`;

  const section = G => {
    const rs = [...G.rows].sort((p,q)=>worst(p)-worst(q));
    return `<div class="card"><div class="spread"><h2 style="margin:0">${esc(G.n)}</h2><strong>${pc(G.L)}%</strong></div>
      <p class="muted small" style="margin-top:6px">Зверху те, де розбіжність найбільша.</p>${rs.map(o=>block(G,o)).join("")}</div>`;
  };

  $app.innerHTML = `
    <div class="spread"><h1>${nx} і ${ny}</h1><button id="home" class="small">На початок</button></div>
    <div class="card">
      <div class="label">Сумісність</div>
      <div class="score">${r.score}%</div>
      <div class="kv" style="margin-top:12px">
        ${r.groups.map(G=>`<span>${esc(G.n)}</span><strong>${pc(G.L)}%</strong>`).join("")}
        <span>Головне в житті</span><strong>${r.common.length} з 3 спільне</strong>
      </div>
      <p class="muted small" style="margin-top:10px">✓ збігається · ≈ близько · ✗ інакше</p>
    </div>
    ${[r.groups[1], r.groups[0], r.groups[2]].map(section).join("")}
    <div class="card">
      <h2 style="margin-top:0">Як бачить себе</h2>
      ${FUN.filter(it=>it.grp==="self").map(it=>{ const t = P => { const a = P.ans[it.id]; return a && a.me && a.me.length ? esc(T(it.o[a.me[0]], P.g)) : "—"; };
        return `<div class="pair"><strong>${esc(it.t)}</strong><div class="small">${nx}: ${t(X)}<br>${ny}: ${t(Y)}</div></div>`; }).join("")}
    </div>
    <div class="card">
      <h2 style="margin-top:0">Головне в житті</h2>
      <p><strong>${nx}:</strong> ${X.val.map(k=>esc(VALUES[k]).toLowerCase()).join(", ")}</p>
      <p><strong>${ny}:</strong> ${Y.val.map(k=>esc(VALUES[k]).toLowerCase()).join(", ")}</p>
      ${r.common.length?`<p class="good">Спільне: ${r.common.map(k=>esc(VALUES[k]).toLowerCase()).join(", ")}</p>`:""}
    </div>
    <p class="muted small">Як рахується: те, що один сказав про себе, порівнюється з тим, що підходить іншому; «байдуже» не рахується. В останній частині дивиться, чи є спільний варіант. Сусідній варіант на шкалі дає частковий збіг. Питання 90 %, головне в житті 10 %. Число грубе; головне тут те, що варто обговорити.</p>
  `;
}

// ---------- Обмін кодами ----------
function encode(p){ return btoa(unescape(encodeURIComponent(JSON.stringify({n:p.name,g:p.g,a:p.ans,v:p.val})))); }
function decode(s){ const o=JSON.parse(decodeURIComponent(escape(atob(s.trim())))); return {name:o.n, g:o.g, ans:o.a, val:o.v, done:true, step:STEPS.length}; }
function viewCode(){
  const p=S.people;
  $app.innerHTML = `
    <div class="spread"><h1>Обмін кодами</h1><button id="home" class="small">На початок</button></div>
    <p class="muted">Якщо проходите на різних пристроях: кожен проходить у себе, копіює свій код і надсилає іншому. Інший вставляє його в будь-яке поле нижче, код сам стане на місце чоловіка чи жінки.</p>
    ${[0,1].map(i=>`
      <div class="card">
        <h3 style="margin-top:0">${esc(p[i].name)}</h3>
        ${p[i].done?`<textarea readonly id="out${i}">${encode(p[i])}</textarea>
          <div class="row" style="margin-top:8px"><button data-copy="${i}">Скопіювати код</button></div>`:`<p class="muted small">Ще не пройдено.</p>`}
        <div class="label" style="margin-top:14px">Вставити код замість цього учасника</div>
        <textarea id="in${i}" placeholder="Код"></textarea>
        <div class="row" style="margin-top:8px"><button data-load="${i}">Завантажити</button><span id="msg${i}" class="small"></span></div>
      </div>`).join("")}
  `;
  $app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    const t=document.getElementById("out"+b.dataset.copy);
    try{ await navigator.clipboard.writeText(t.value); b.textContent="Скопійовано"; }catch(e){ t.select(); b.textContent="Виділено, скопіюй вручну"; }
  });
  $app.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.load, m=document.getElementById("msg"+i);
    try{ const d=decode(document.getElementById("in"+i).value); S.people[d.g==="f"?1:0]=d; normalize(S); save(); viewCode(); }
    catch(e){ m.textContent="Код не читається"; m.className="small warn"; }
  });
}

function isAnswered(p, st){
  if(st.kind==="intro") return true;
  if(st.kind==="values") return p.val.length===3;
  const it = {self:BASE, want:BASE, sit:SIT, ideal:IDEAL, pair:PAIR, fun:FUN}[st.kind][st.i], a = p.ans[it.id];
  if(!a) return false;
  const me = Array.isArray(a.me) ? a.me : [];
  if(st.kind==="want") return Array.isArray(a.att) && a.att.length===it.ask.length && a.att.every(x=>x!=null);
  if(st.kind==="sit" || st.kind==="ideal") return me.length>0 && (a.want===null || (Array.isArray(a.want) && a.want.length>0));
  return me.length>0;
}
S.people.forEach(p=>{
  if(p.sig===STEPS.length) return;
  if(p.done || p.step>0){
    let k = STEPS.findIndex(st=>!isAnswered(p, st));
    if(k<0){ p.done = true; p.step = STEPS.length; }
    else { if(k>0 && STEPS[k-1].kind==="intro") k--; p.done = false; p.step = k; }
  }
  p.sig = STEPS.length;
});
save();
render();
// Офлайн на телефоні: кешує сторінку після першого відкриття (лише по https).
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
